<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API连接测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI营销助手API连接测试</h1>
        
        <div class="test-section">
            <h3>API配置</h3>
            <label>API地址: <input type="text" id="apiUrl" value="http://localhost:8003"></label><br>
            <button onclick="testConnection()">测试连接</button>
            <button onclick="testAnalyze()">测试客户分析</button>
            <button onclick="clearResults()">清空结果</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(title, success, data) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-section ${success ? 'success' : 'error'}`;
            div.innerHTML = `
                <h4>${title} - ${success ? '成功' : '失败'}</h4>
                <pre>${JSON.stringify(data, null, 2)}</pre>
                <small>时间: ${new Date().toLocaleString()}</small>
            `;
            results.appendChild(div);
        }

        async function testConnection() {
            const apiUrl = document.getElementById('apiUrl').value;
            
            try {
                console.log('测试连接到:', apiUrl);
                const response = await fetch(`${apiUrl}/health`);
                const data = await response.json();
                
                addResult('健康检查', response.ok, {
                    status: response.status,
                    data: data
                });
            } catch (error) {
                console.error('连接失败:', error);
                addResult('健康检查', false, {
                    error: error.message,
                    stack: error.stack
                });
            }
        }

        async function testAnalyze() {
            const apiUrl = document.getElementById('apiUrl').value;
            
            try {
                console.log('测试客户分析API:', apiUrl);
                const response = await fetch(`${apiUrl}/api/v1/enhanced-analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_input: "我在青岛工作，有两个孩子，想换一台大一点的车，预算10万左右",
                        advisor_notes: "客户是青岛的家庭用户，需要换购升级，关注空间实用性",
                        analysis_type: "comprehensive"
                    })
                });
                
                const data = await response.json();
                
                addResult('客户分析', response.ok, {
                    status: response.status,
                    data: data
                });
            } catch (error) {
                console.error('分析失败:', error);
                addResult('客户分析', false, {
                    error: error.message,
                    stack: error.stack
                });
            }
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // 页面加载时自动测试连接
        window.onload = function() {
            console.log('页面加载完成，开始自动测试...');
            testConnection();
        };
    </script>
</body>
</html>
